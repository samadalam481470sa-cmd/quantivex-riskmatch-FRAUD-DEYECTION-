# Single-node reference deployment ONLY. Not high availability or production-certified.
# Requires OIDC provider, HTTPS reverse proxy and encrypted host volume.
services:
  riskmesh:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    environment:
      RISK_MESH_ENV: production
      RISK_MESH_DB_PATH: /data/riskmesh.db
      RISK_MESH_TENANT_ID: ${RISK_MESH_TENANT_ID:?required}
      RISK_MESH_API_KEY: ${RISK_MESH_API_KEY:?required}
      RISK_MESH_OIDC_ISSUER: ${RISK_MESH_OIDC_ISSUER:?required}
      RISK_MESH_OIDC_AUDIENCE: ${RISK_MESH_OIDC_AUDIENCE:?required}
      RISK_MESH_OIDC_JWKS_URL: ${RISK_MESH_OIDC_JWKS_URL:?required}
    volumes:
      - riskmesh_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  riskmesh_data:
