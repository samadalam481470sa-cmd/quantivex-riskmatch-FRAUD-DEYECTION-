name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Smoke test
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          for _ in range(30):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=3) as response:
                      assert json.load(response)["status"] == "ok"
                  with urlopen("http://127.0.0.1:8000/", timeout=3) as response:
                      assert "Fraud Intelligence" in response.read().decode()
                  with urlopen("http://127.0.0.1:8000/api/v1/demo/investigate/circular-ring", timeout=3) as response:
                      case = json.load(response)
                      assert case["decision"] == "block"
                      assert case["data_source"] == "fixed-synthetic-only"
                  with urlopen("http://127.0.0.1:8000/assets/dashboard.js", timeout=3) as response:
                      assert "Run investigation" in response.read().decode()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("RiskMesh container did not become healthy")
          PY
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
